[project]
name = "rag"
version = "0.1.0"
description = "Local hybrid retrieval over your own files."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "sentence-transformers>=3.0.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.8",
    "mypy>=1.13",
    "pytest-cov>=6.0",
    "pytest-randomly>=3.16",
    "pytest-xdist>=3.6",
    "mutmut>=3.2",
    "pip-audit>=2.7",
]
ocr = ["rapidocr-onnxruntime>=1.3.0"]
layout = ["docling>=2.0.0"]

[project.scripts]
rag = "rag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mutmut]
only_mutate = ["src/rag/chunk.py", "src/rag/retrieve.py", "src/rag/gates.py"]
also_copy = ["evals", "documents"]

[tool.mypy]
strict = true
packages = ["rag"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "onnxruntime",
    "onnxruntime.*",
    "rapidocr_onnxruntime",
    "rapidocr_onnxruntime.*",
    "yaml",
    "yaml.*",
    "lxml",
    "lxml.*",
    "docling",
    "docling.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "torch",
    "torch.*",
]
ignore_missing_imports = true
