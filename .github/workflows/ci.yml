name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install -U pip uv==0.12.5
      - name: Install from the lockfile
        run: uv sync --frozen --extra dev
      - name: Suite corpus pins and kinds
        run: |
          uv run python - <<'PY'
          from rag.evaluate import assert_kind_coverage, load_rows, load_suite, verify_corpus
          suite = load_suite("evals/suite.yaml")
          pins = verify_corpus(suite)
          kinds = assert_kind_coverage(load_rows(suite.get("rows") or "evals/policy.jsonl"))
          assert not pins, pins
          assert not kinds, kinds
          print("suite corpus pins OK; kinds OK")
          PY
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy --strict src/
      - name: No coverage pragmas outside the allowed spots
        run: |
          uv run python - <<'PY'
          import pathlib
          bad = []
          for path in pathlib.Path(".").rglob("*.py"):
              if any(part in {".venv", "mutants", ".git"} for part in path.parts):
                  continue
              typing = False
              depth = 0
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  stripped = line.strip()
                  indent = len(line) - len(line.lstrip())
                  if stripped.startswith("if TYPE_CHECKING:"):
                      typing = True
                      depth = indent
                      continue
                  if typing and stripped and indent <= depth:
                      typing = False
                  allowed = path.as_posix() == "src/rag/__main__.py" or typing
                  if "pragma: no cover" in line and not allowed:
                      bad.append(f"{path}:{number}")
          if bad:
              raise SystemExit(
                  "pragma: no cover outside TYPE_CHECKING and __main__:\n" + "\n".join(bad)
              )
          PY
      - name: Pytest without random order
        run: uv run pytest -q --tb=short -p no:randomly
      - name: Pytest in random order
        run: uv run pytest -q --tb=short
      - name: Pytest across workers
        run: uv run pytest -q --tb=short -n auto -p no:randomly
      - name: Branch coverage
        run: uv run pytest -q --tb=short -p no:randomly --cov=rag --cov-branch --cov-fail-under=100
      - name: Audit dependencies
        run: uv run pip-audit

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install -U pip uv==0.12.5
      - name: Install from the lockfile
        run: uv sync --frozen --extra dev
      - name: Mutation score
        run: uv run mutmut run
      - name: Export mutation stats
        run: uv run mutmut export-cicd-stats
      - name: Enforce the killed-ratio floor
        run: uv run python scripts/mutmut_floor.py

  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install -U pip uv==0.12.5
      - name: Install from the lockfile
        run: uv sync --frozen --extra dev
      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen3-bge-${{ hashFiles('src/rag/models.py') }}
      - name: Cache the CPU generator
        uses: actions/cache@v4
        with:
          path: |
            tools/llama-b11093
            models/qwen2.5-1.5b-instruct-q4_k_m.gguf
          key: llama-b11093-qwen2.5-1.5b-q4
      - name: Download llama.cpp and the 1.5B model
        run: |
          set -euo pipefail
          if [ ! -x tools/llama-b11093/llama-server ]; then
            mkdir -p tools
            curl -L --fail --retry 3 -o tools/llama.tar.gz \
              https://github.com/ggml-org/llama.cpp/releases/download/b11093/llama-b11093-bin-ubuntu-x64.tar.gz
            tar -xzf tools/llama.tar.gz -C tools
          fi
          mkdir -p models
          test -f models/qwen2.5-1.5b-instruct-q4_k_m.gguf || curl -L --fail --retry 3 \
            -o models/qwen2.5-1.5b-instruct-q4_k_m.gguf \
            https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
      - name: Start the generator
        run: |
          set -euo pipefail
          tools/llama-b11093/llama-server \
            -m models/qwen2.5-1.5b-instruct-q4_k_m.gguf \
            --host 127.0.0.1 --port 8081 -t 4 \
            --alias qwen2.5-1.5b-instruct \
            > llama-server.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8081/health && exit 0
            sleep 2
          done
          cat llama-server.log
          exit 1
      - name: Policy eval
        env:
          GENERATOR_URL: http://127.0.0.1:8081/v1
          GENERATOR_MODEL: qwen2.5-1.5b-instruct
          RAG_ANSWER_ROWS: ci
          RAG_SKIP_SLOW_MODES: "1"
          STAGE_HARD_MS_embed_query: "120000"
        run: uv run pytest -m eval -o addopts= --tb=short
      - name: Upload the eval log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-eval
          path: |
            llama-server.log
            .pytest_cache

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image from the lockfile
        run: docker build -t reading-room:ci .
