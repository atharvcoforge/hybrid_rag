name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Suite corpus pins and kinds
        run: |
          python - <<'PY'
          from rag.evaluate import assert_kind_coverage, load_rows, load_suite, verify_corpus
          suite = load_suite("evals/suite.yaml")
          pins = verify_corpus(suite)
          kinds = assert_kind_coverage(load_rows(suite.get("rows") or "evals/policy.jsonl"))
          assert not pins, pins
          assert not kinds, kinds
          print("suite corpus pins OK; kinds OK")
          PY
      - name: Test
        run: pytest -q --tb=short
      - name: Coverage gate on critical modules
        run: |
          pip install pytest-cov
          pytest -q --cov=rag.chunk --cov=rag.retrieve --cov=rag.gates --cov=rag.layout --cov-fail-under=70

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
